<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Spin Wheel — Controlled Prizes</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg,#f2f6ff,#eef7f1);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 560px;
      text-align: center;
    }

    /* Pointer fixed at top center, pointing downward */
#pointer {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: -18px;   /* keep it at the top */
  z-index: 30;
  width: 0;
  height: 0;
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-top: 34px solid #e84545;  /* makes it point downward */
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}


    canvas#wheel {
      display: block;
      margin: 30px auto 0;
      border-radius: 50%;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      width: 520px; height: 520px;
    }

    .controls {
      margin-top: 14px;
      display: flex;
      flex-direction: column; /* stack buttons vertically */
      align-items: center;
      gap: 12px;
      justify-content: center;
    }
    button {
      border: none;
      background: #2d9cdb;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(45,156,219,0.24);
    }
    button.secondary {
      background: #6c757d;
      box-shadow: 0 6px 14px rgba(108,117,125,0.18);
    }

    /* Result overlay */
    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px);
    }

    .popup {
      width: min(640px, 92%);
      background: linear-gradient(180deg,#ffffff,#fff9ea);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      position: relative;
      overflow: hidden;
    }

    .popup h1 {
      margin: 6px 0 12px;
      font-size: 34px;
      letter-spacing: 0.6px;
    }
    .popup p {
      margin: 0 0 18px;
      font-size: 20px;
    }
    .popup .ok {
      margin-top: 6px;
      padding: 10px 18px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #2d9cdb;
      color: #fff;
      cursor: pointer;
    }

    /* Jackpot embellishment */
    .trophy {
      font-size: 56px;
      display: inline-block;
      margin-bottom: 8px;
      transform: translateY(-6px);
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 12px;
      height: 12px;
      opacity: 0.95;
      z-index: 150;
      pointer-events: none;
      transform-origin: center;
      border-radius: 2px;
      will-change: transform;
    }

    /* Sparkle */
    .sparkle {
      position: absolute;
      width: 140px;
      height: 140px;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.05) 30%, rgba(255,255,255,0) 55%);
      filter: blur(6px);
      pointer-events: none;
      z-index: 160;
      opacity: 0;
      transition: opacity .3s ease;
    }
    .sparkle.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div id="pointer"></div>
    <canvas id="wheel" width="520" height="520"></canvas>
    <div class="controls">
      <button id="spinBtn">🎡 Spin</button>
      <!-- hidden-but-clickable reset -->
      <button id="resetBtn" class="secondary" title="hidden reset">🔄 Reset Counter</button>
    </div>
  </div>

  <!-- Overlay -->
  <div id="overlay">
    <div class="popup">
      <div id="popupTop"></div>
	  <h3 id="popupTitle"></h3>
      <h1 id="popupMessage"></h1>
      <button class="ok" id="closeOverlayBtn">OK</button>
    </div>
  </div>
  <div id="spark" class="sparkle"></div>

  <script>
  // ----- slots + colors -----
  const slots = [
    "Pen","Chocolate","Try Again","Jackpot",
    "Keyring","Frame","Mug","80% Discount",
    "100 Rupees off","One more spin","Pen",
    "Chocolate","Keyring","Try Again",
    "50 Rupees cashback","100 Rupees cashback",
    "50% off","20% off","Dairy","Soft toy",
    "Phone cover","Water bottle"
  ];

  const colors = [
    "#f8b400","#6a2c70","#b83b5e","#0f4c75","#3282b8",
    "#f08a5d","#00b894","#e84393","#2d3436","#fd79a8",
    "#ff7675","#55efc4","#74b9ff","#ffeaa7","#d63031",
    "#00cec9","#6c5ce7","#fd79a8","#a29bfe","#fab1a0"
  ];

  // ----- canvas -----
  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const size = canvas.width;
  const cx = size / 2, cy = size / 2;

  // ----- state -----
  let rotation = 0;
  let spinning = false;
  let spinCount = 0; // total spins done (starts 0, 1st spin becomes 1)

  function drawWheel() {
    const num = slots.length;
    const arc = (2 * Math.PI) / num;
    ctx.clearRect(0,0,size,size);

    for (let i = 0; i < num; i++) {
      const start = i * arc + rotation;
      const end = start + arc;

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, cx - 6, start, end);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.08)";
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + arc / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 13px Arial";
      ctx.fillText(slots[i], cx - 28, 6);
      ctx.restore();
    }

    // center
    ctx.beginPath();
    ctx.arc(cx,cy, 60, 0, Math.PI*2);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#f0f0f0";
    ctx.stroke();
    ctx.fillStyle = "#333";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "center";
    ctx.fillText("SHAURYA", cx, cy+6);
  }

  drawWheel();

  // ----- controls + UI refs -----
  const spinBtn = document.getElementById("spinBtn");
  const resetBtn = document.getElementById("resetBtn");
  const overlay = document.getElementById("overlay");
  const popupTitle = document.getElementById("popupTitle");
  const popupMessage = document.getElementById("popupMessage");
  const popupTop = document.getElementById("popupTop");
  const closeOverlayBtn = document.getElementById("closeOverlayBtn");
  const spark = document.getElementById("spark");

  // hide reset visually (still clickable)
  resetBtn.style.background = "transparent";
  resetBtn.style.color = "transparent";
  resetBtn.style.boxShadow = "none";
  resetBtn.style.border = "none";

  spinBtn.addEventListener("click", startSpin);
  resetBtn.addEventListener("click", () => { spinCount = 0; /* no alert */ });
  closeOverlayBtn.addEventListener("click", () => overlay.style.display="none");

  // ----- prize messages -----
  const messages = {
    "Pen": "✍️ You got a Pen! Write your success story.",
    "Chocolate": "🍫 Sweet! Enjoy your Chocolate treat.",
    "Try Again": "😅 Almost! Better luck next time.",
    "Jackpot": "🏆 The ultimate Jackpot! You’re a winner!",
    "Keyring": "🔑 Handy! You won a cool Keyring.",
    "Frame": "🖼️ Capture memories with this Frame.",
    "Mug": "☕ Cheers! You got a Mug.",
    "80% Discount": "💸 Huge savings! 80% OFF coupon for you!",
    "100 Rupees off": "💰 Enjoy ₹100 off on your next purchase.",
    "One more spin": "🎡 Lucky you! Another spin awaits.",
    "50 Rupees cashback": "💵 You just won ₹50 cashback!",
    "100 Rupees cashback": "💵 Amazing! ₹100 cashback added to your account!",
    "50% off": "🎁 Half-price deal just for you!",
    "20% off": "🔥 Save 20% on your next buy.",
    "Dairy": "🥛 Fresh Dairy product is yours!",
    "Soft toy": "🧸 Cuteness overload! A soft toy prize.",
    "Phone cover": "📱 Stylish phone cover won!",
    "Water bottle": "💧 Stay hydrated with this bottle."
  };

  // ----- core spin logic (robust forced-prize detection) -----
  function startSpin() {
    if (spinning) return;          // prevent double start
    spinning = true;

    // compute next spin number (1-based)
    const nextSpinNumber = spinCount + 1;

    // decide forced prize based on nextSpinNumber
    let forcedPrize = null;
    // order matters: check Jackpot (9) first, then 7, then 4
    if (nextSpinNumber % 9 === 0) {
      forcedPrize = "Jackpot";
    } else if (nextSpinNumber % 9 === 7) {
      forcedPrize = "100 Rupees cashback";
    } else if (nextSpinNumber % 9 === 4) {
      forcedPrize = "80% Discount";
    }

    // choose targetIndex
    let targetIndex;
    if (forcedPrize) {
      targetIndex = slots.indexOf(forcedPrize);
      if (targetIndex === -1) {
        console.warn("Forced prize not found in slots:", forcedPrize);
        // fallback to random
        targetIndex = Math.floor(Math.random() * slots.length);
      }
    } else {
      // random (allow any slot, including Jackpot occasionally via random)
      targetIndex = Math.floor(Math.random() * slots.length);
    }

    console.debug("Spin#", nextSpinNumber, "forcedPrize:", forcedPrize, "targetIndex:", targetIndex);

    // commit the spin count (we update once we've decided the prize)
    spinCount = nextSpinNumber;

    // normalize rotation so animations are consistent
    rotation = rotation % (2 * Math.PI);

    const arc = (2 * Math.PI) / slots.length;
    const pointerAngle = -Math.PI / 2; // top
    const targetMidAngle = targetIndex * arc + arc / 2;

    // long spins (25-30 turns)
    const fullSpins = 25 + Math.floor(Math.random() * 6);
    let desiredRotation = pointerAngle - targetMidAngle + fullSpins * 2 * Math.PI;

    // ensure forward rotation
    while (desiredRotation <= rotation) desiredRotation += 2 * Math.PI;

    // animate
    animateSpin(rotation, desiredRotation, 6500, () => {
      spinning = false;

      if (forcedPrize === "Jackpot") {
        showOverlay("Jackpot", true);
      } else {
        showOverlay(slots[targetIndex], false);
      }
      // NOTE: we intentionally DO NOT reset spinCount here so cycle remains consistent
    });
  }

  function animateSpin(from, to, duration, callback) {
    const start = performance.now();
    function frame(now) {
      const elapsed = now - start;
      const t = Math.min(1, elapsed / duration);
      const eased = easeOutCubic(t);
      rotation = from + (to - from) * eased;
      drawWheel();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = to % (2 * Math.PI); // keep rotation small after finishing
        drawWheel();
        callback && callback();
      }
    }
    requestAnimationFrame(frame);
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  // ----- overlay / confetti -----
  function showOverlay(prize, isJackpot) {
    overlay.style.display = "flex";
    popupTop.innerHTML = isJackpot ? '<div class="trophy">🏆</div>' : "";
    popupTitle.innerText = isJackpot ? "🏆 JACKPOT! You are the luckiest!" : "✨ You won!";
    popupMessage.innerText = messages[prize] || ("You won: " + prize);

    if (isJackpot) {
      launchConfetti(120, true);
    } else {
      spark.classList.add("show");
      setTimeout(()=>spark.classList.remove("show"), 900);
      launchConfetti(40, false);
    }
  }

  function launchConfetti(count, big) {
    const palette=["#f8b400","#6a2c70","#b83b5e","#0f4c75","#3282b8","#f08a5d","#00b894","#e84393","#2d3436"];
    for (let i = 0; i < count; i++) {
      const el = document.createElement("div");
      el.className = "confetti";
      el.style.background = palette[Math.floor(Math.random() * palette.length)];
      el.style.left = Math.random() * window.innerWidth + "px";
      el.style.top = (big ? -40 - Math.random() * 80 : -20 - Math.random() * 40) + "px";
      const size = (big ? 12 : 8) + Math.random() * 8;
      el.style.width = size + "px";
      el.style.height = size + "px";
      document.body.appendChild(el);
      requestAnimationFrame(() => {
        const x = -200 + Math.random() * 400;
        const y = window.innerHeight + 200;
        const r = Math.random() * 720;
        el.style.transition = `transform 3s linear, opacity 3s linear`;
        el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg)`;
        el.style.opacity = "0";
      });
      setTimeout(() => el.remove(), 3100);
    }
  }

  // expose small API for debugging (open console)
  window._wheel = {
    spinCount() { return spinCount; },
    resetCounter() { spinCount = 0; console.log("counter reset"); },
    forcePrize(prize) {
      // temporarily set spinCount so nextSpinNumber triggers prize
      // e.g. to force 4th prize: set spinCount = 3 then click spin
      console.log("set spinCount so next spin can hit:", prize);
    }
  };

  </script>
</body>
</html>
